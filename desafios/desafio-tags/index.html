<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags HTML</title>
</head>
<body>
    <h1>Tags em HTML</h1>
    <p>Em HTML5, podemos inserir os elementos da lista a seguir. Passe o mouse sobre os termos para descobrir qual Tag deverá usar em cada caso.</p>
    <ul type="square">
        <li><abbr title="Para Parágrafo usa-se a tag &lt;p&gt;">Parágrafo</abbr></li>
        <li><abbr title="Para Títulos usa-se a tag &lt;h&lt; à &lt;h6&gt;">Títulos</abbr></li>
        <li><abbr title="Para acrescentar imagem &lt;tag&gt; ">Imagem</abbr></li>
        <li><abbr title="Para abreviações &lt;abbr&gt;">Abreviações</abbr></li>
        <li><abbr title="Usa-se &lt;code&gt;">Código-Fonte</abbr></li>
        <li><abbr title="Usa-se &lt;ol&gt; e &lt;li&gt;">Listas numericas</abbr></li>
        <li><abbr title="Usa-se &lt;ul&gt; e &lt;li&gt;">Listas com demarcação</abbr></li>
    </ul>
</body>
</html>
