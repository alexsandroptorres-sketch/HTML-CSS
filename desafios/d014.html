<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desafio Tabela 014</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        padding: 10px;
      }

      table {
        border-collapse: collapse;
      }

      thead {
        background-color: gray;
        color: white;
      }

      tr,
      th,
      td {
        border: 1px solid black;
        padding: 10px;
        text-align: center;
      }

      .media {
        background-color: gray;
        color: white;
      }
    </style>
  </head>
  <body>
    <table>
      <thead>
        <tr>
          <th colspan="2" rowspan="2" scope="col">Áreas</th>

          <th colspan="2" scope="col">Notas</th>
          <th rowspan="2" scope="col">Média</th>
        </tr>
        <tr>
          <th scope="col">Nota 1</th>
          <th scope="col">Nota 2</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th colspan="2" rowspan="4" scope="col">Exatas</th>

          <td>0.0</td>

          <td>0.0</td>
        </tr>
        <tr>

          <td>0.0</td>
          <td>0.0</td>

        </tr>
        <tr>

          <td>0.0</td>

        </tr>
        <tr>
          <td colspan="2">Biologia</td>
          <td>0.0</td>
          <td>0.0</td>
          <td>0.0</td>
        </tr>
        <tr class="media">
          <th colspan="6" scope="row">Média de Exatas</th>
          <td>0.0</td>
        </tr>
        <tr>
          <th colspan="2" rowspan="2" scope="col">Humanas</th>
          <td colspan="2">História</td>
          <td>0.0</td>
          <td>0.0</td>
          <td>0.0</td>
        </tr>
        <tr>
          <td colspan="2">Geografia</td>
          <td>0.0</td>
          <td>0.0</td>
          <td>0.0</td>
        </tr>
        <tr class="media">
          <th colspan="6" scope="row">Média de Humanas</th>
          <td>0.0</td>
        </tr>
      </tbody>
    </table>

</html>
