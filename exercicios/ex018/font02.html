<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
                    @font-face {
                font-family: "love";
                src: url("Beaming.otf") format("opentype");
                font-weight: normal;
                font-style: normal;
                /*
                tipo de format()
                -opentype (otf)
                -truetype (ttf)
                embedded-opentype
                -truetype-att (Apple Advanced Typography)
                -svg

                */
            }
        body {

            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            font-family: 'love', Times, serif;
            font-size: 3m;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Olá, Mundo!</h1>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Mollitia sunt commodi rem suscipit modi maxime cupiditate est ad qui odio iure porro nulla id, quos earum quis quas maiores sequi?</p>
</body>
</html>
