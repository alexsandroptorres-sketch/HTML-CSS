<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <style>
        * { /*configurações globais da CSS*/
            height: 100%;
        }
        body{ /*podemos usar os comandos right,left,top,bottom comando de direção ou também porcentagem*/
            background-image: linear-gradient(-45deg , #F20587, #F205E2, #960CF2, #F29F05, #F25D07);
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <h1>Testando gladientes</h1>

</body>
</html>
