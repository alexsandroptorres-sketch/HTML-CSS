<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalhando com links</title>
</head>
<body>
    <h1>Usando links externos</h1>
    <p>Você pode acessar meu <a href="https://gustavoguanabara.github.io/" target="-blank" rel="external">repositório publico no GitHub</a>.</p> <!--A tag (a) significa Âncora e serve para trasformar termo em hiperlink-->
    <p>Você também pode acessar meu <a href="https://youtube.com/cursoemvideo/" target="-blank" rel="external">canal do youtube</a>.</p> <!--A tag target e a rel serve para abrir em uma nova aba.-->
</body>
</html>
